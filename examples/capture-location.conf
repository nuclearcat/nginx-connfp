# Include inside an existing server {} terminating the original TCP connection.
# Enable tcp_save_syn on; in that server. Use an operator-controlled endpoint
# for labeled collection, then remove this location after collecting samples.
# Record OS identity from the known device, never from HTTP headers.
location = /__connfp_sample {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"syn":"$connfp_syn","tlsfp":"$connfp_tls","captured_at":"$time_iso8601"}';
}
